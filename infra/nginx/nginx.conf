# Reverse proxy de producao do prihora.
# /api/*  -> backend FastAPI
# /*      -> frontend Next.js

upstream prihora_api {
    server backend:8000;
}

upstream prihora_web {
    server frontend:3000;
}

# Compressao
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript
           application/x-javascript text/xml application/xml image/svg+xml;

# Rate limit basico para a API
limit_req_zone $binary_remote_addr zone=prihora_api_zone:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 12M;

    # Cabecalhos de seguranca
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---------------------------------------------------------------- API ---
    location /api/ {
        limit_req zone=prihora_api_zone burst=40 nodelay;

        proxy_pass         http://prihora_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Fotos de perfil. Servidas pelo backend para o comportamento ser identico
    # ao de desenvolvimento. O nome do arquivo carrega um sufixo aleatorio,
    # entao cache longo e seguro: trocar a foto muda a URL.
    location /media/ {
        proxy_pass       http://prihora_api;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /health {
        proxy_pass http://prihora_api/health;
        access_log off;
    }

    location /docs {
        proxy_pass       http://prihora_api/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass       http://prihora_api/openapi.json;
        proxy_set_header Host $host;
    }

    # ------------------------------------------------ assets estaticos Next ---
    location /_next/static/ {
        proxy_pass       http://prihora_web;
        proxy_set_header Host $host;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ------------------------------------------------------------ frontend ---
    location / {
        proxy_pass         http://prihora_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
