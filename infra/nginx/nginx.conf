# Reverse proxy de producao do prihora.
# /api/*  -> backend FastAPI
# /*      -> frontend Next.js

# DNS interno do Docker. Sem isto o nginx resolvia "backend" e "frontend" so
# uma vez, ao carregar: recriar qualquer um dos dois mudava o IP do container e
# o nginx continuava a falar com o endereco antigo, devolvendo 502 ate um
# reload manual. Com o resolver e o proxy_pass por variavel, reresolve sozinho.
resolver 127.0.0.11 valid=10s ipv6=off;

# --------------------------------------------- atras do proxy do host ---
# O Caddy termina o TLS e encaminha para ca. Sem as duas regras abaixo o
# nginx ve todos os pedidos a chegar do gateway do Docker: o rate limit
# passaria a ser um balde unico partilhado pelo site inteiro, e o X-Real-IP
# apontaria para o proxy em vez do visitante.
set_real_ip_from 172.18.0.0/16;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

# $scheme aqui e sempre http, porque o TLS acabou no Caddy. Preservar o
# protocolo original evita que a app gere URLs http dentro de paginas https.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ~.      $http_x_forwarded_proto;
}

# Compressao
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript
           application/x-javascript text/xml application/xml image/svg+xml;

# Rate limit basico para a API
limit_req_zone $binary_remote_addr zone=prihora_api_zone:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 12M;

    set $api http://backend:8000;
    set $web http://frontend:3000;

    # Cabecalhos de seguranca
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---------------------------------------------------------------- API ---
    location /api/ {
        limit_req zone=prihora_api_zone burst=40 nodelay;

        proxy_pass         $api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Fotos de perfil. Servidas pelo backend para o comportamento ser identico
    # ao de desenvolvimento. O nome do arquivo carrega um sufixo aleatorio,
    # entao cache longo e seguro: trocar a foto muda a URL.
    location /media/ {
        proxy_pass       $api;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /health {
        proxy_pass $api/health;
        access_log off;
    }

    location /docs {
        proxy_pass       $api/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass       $api/openapi.json;
        proxy_set_header Host $host;
    }

    # ------------------------------------------------ assets estaticos Next ---
    location /_next/static/ {
        proxy_pass       $web;
        proxy_set_header Host $host;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ------------------------------------------------------------ frontend ---
    location / {
        proxy_pass         $web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }
}
