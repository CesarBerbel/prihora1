# Overrides de DESENVOLVIMENTO: bind mounts + hot reload.
services:
  db:
    ports:
      - "${DB_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    volumes:
      - ./backend:/app
      # Precisa vir depois do bind acima, senao /app o sombreia.
      - media_data:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      ENV: development

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./backend:/app
      - media_data:/app/media

  whatsapp:
    build:
      context: ./whatsapp
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./whatsapp/src:/app/src
      - whatsapp_data:/data


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-prihora}
      WATCHPACK_POLLING: "true"
